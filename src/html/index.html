<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CityGenerator - AI Learning Simulation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --accent:  #0d6efd;
      --accent-rl: #6c75ff;
      --radius:  .75rem;
      --card-sh: 0 4px 20px rgba(0,0,0,.05);
      --bg-main: #f8f9fa;
      --dark-blue: #0d1b2a;
    }
    body { 
      background: var(--bg-main); 
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .hero-header {
      background: linear-gradient(135deg, var(--dark-blue) 0%, #1a3a5c 100%);
      color: #fff;
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      box-shadow: var(--card-sh);
    }
    
    .header-title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
    }
    .header-title-row h1 { margin: 0; font-size: 1.3rem; font-weight: 700; }
    
    #sim-status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #28a745;
      box-shadow: 0 0 0 3px rgba(40,167,69,0.3);
    }

    .circle-mask {
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      width: 290px; height: 290px;
      background: #dde6ee;
      border: 4px solid rgba(255, 255, 255, 0.9);
    }
    #map-canvas { display: block; width: 100%; height: 100%; }

    .sim-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--card-sh);
      border: 1px solid rgba(0,0,0,.03);
      padding: 1.25rem;
    }
    .card-title-custom {
      font-size: 0.8rem;
      font-weight: 700;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #f1f3f5;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }

    /* Fixed Button Grid to Stop Edge Overflow */
    .btn-responsive-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      width: 100%;
      margin-bottom: 1.5rem;
    }

    .tuning-control-grid {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
<div class="container-fluid py-3 d-flex flex-column gap-3 mx-auto" style="max-width: 1100px;">
  
  <header class="hero-header">
    <div class="header-title-row">
      <div id="sim-status-dot"></div>
      <h1>CityGenerator <span class="badge bg-primary bg-opacity-50 text-white" style="font-size:0.7rem; vertical-align: middle;">v1.1.1</span></h1>
    </div>
    
    <div class="circle-mask">
      <canvas id="map-canvas" width="290" height="290"></canvas>
    </div>
  </header>

  <div class="row g-3">
    
    <div class="col-12 col-md-5">
      <div class="sim-card d-flex flex-column h-100">
        
        <div class="card-title-custom">🎛️ Console Control Matrix</div>
        <div class="btn-responsive-grid">
          <button id="resume-btn" type="button" class="btn btn-success btn-sm w-100">▶ Resume</button>
          <button id="pause-btn"  type="button" class="btn btn-warning btn-sm w-100">⏸ Pause</button>
          <button id="random-city-model-btn" type="button" class="btn btn-primary btn-sm w-100">🔀 Mutation</button>
          <button id="reset-btn" type="button" class="btn btn-danger btn-sm w-100">↺ Reset</button>
        </div>

        <div class="card-title-custom">📊 Engine Diagnostics & Tuning</div>
        <div class="tuning-control-grid">
          <div id="model-select-mount"></div>
          <div id="agent-select-mount"></div>
        </div>
        <div id="manager-info" role="status" aria-live="polite" class="d-flex flex-column gap-2"></div>
        
      </div>
    </div>

    <div class="col-12 col-md-7">
      <div class="sim-card h-100">
        <div class="card-title-custom">🧠 Reinforcement Learning Graphs</div>
        <div id="charts-container"></div>
      </div>
    </div>
    
  </div>

</div>
</body>
</html>
