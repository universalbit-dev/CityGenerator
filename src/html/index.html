<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CityGenerator - AI Learning Simulation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- bundler-generated stylesheet -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* ── Design tokens ───────────────────────────────────── */
    :root {
      --accent:  #0d6efd;
      --accent-rl: #6c75ff;
      --radius:  .75rem;
      --card-sh: 0 2px 10px rgba(0,0,0,.08);
    }

    body { background: #f0f2f5; }

    /* ── App header ──────────────────────────────────────── */
    .app-header {
      background: linear-gradient(135deg,#0d1b2a 0%,#1a3a5c 100%);
      color: #fff;
      border-radius: var(--radius);
      padding: .75rem 1.25rem;
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .app-header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: .02em;
    }

    /* pulsing status dot */
    #sim-status-dot {
      flex-shrink: 0;
      width: 11px; height: 11px;
      border-radius: 50%;
      background: #28a745;
      box-shadow: 0 0 0 3px #28a74533;
      animation: pulse-green 2s infinite;
    }
    #sim-status-dot.paused {
      background: #ffc107;
      box-shadow: 0 0 0 3px #ffc10733;
      animation: pulse-amber 2s infinite;
    }
    #sim-status-dot.learning {
      background: var(--accent-rl);
      box-shadow: 0 0 0 3px rgba(108,117,255,0.2);
      animation: pulse-learning 1.5s infinite;
    }
    @keyframes pulse-green {
      0%,100% { box-shadow: 0 0 0 3px #28a74533; }
      50%      { box-shadow: 0 0 0 6px #28a74511; }
    }
    @keyframes pulse-amber {
      0%,100% { box-shadow: 0 0 0 3px #ffc10733; }
      50%      { box-shadow: 0 0 0 6px #ffc10711; }
    }
    @keyframes pulse-learning {
      0%,100% { box-shadow: 0 0 0 3px rgba(108,117,255,0.2); }
      50%      { box-shadow: 0 0 0 6px rgba(108,117,255,0.1); }
    }

    /* ── Generic white card ──────────────────────────────── */
    .sim-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--card-sh);
    }

    /* ── Map canvas ──────────────────────────────────────── */
    #map-canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: var(--radius);
    }

    /* ── Controls bar ────────────────────────────────────── */
    .section-label {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: #6c757d;
      margin-bottom: .6rem;
    }
    .btn-round {
      border-radius: 10px;
      padding: .45rem 1rem;
      font-size: .92rem;
      font-weight: 600;
      transition: transform .1s;
    }
    .btn-round:active { transform: scale(.96); }

    /* ── RL Agent selector styling ───────────────────────── */
    .form-select.rl-select {
      background: linear-gradient(135deg, #f8f9ff 0%, #e8f0fe 100%);
      border: 2px solid var(--accent-rl);
      color: var(--accent-rl);
      font-weight: 600;
    }
    .form-select.rl-select:focus {
      border-color: var(--accent-rl);
      box-shadow: 0 0 0 0.2rem rgba(108,117,255,0.25);
    }

    /* ── Model info banner (index.js writes innerHTML here) ── */
    #manager-info {
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      background: linear-gradient(90deg,#e8f0fe,#f0faf4);
      padding: .75rem 1.1rem;
      font-size: .95rem;
    }
    #manager-info .model-name { color: var(--accent); font-weight: 700; }
    #manager-info .model-tip  { color: #6c757d; margin: 0; }

    /* ── Charts container ────────────────────────────────── */
    #charts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      width: 100%;
      box-sizing: border-box;
    }
    
    /* Chart wrappers */
    #charts-container > div[data-chart-wrapper="1"] {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--card-sh);
      padding: 1rem;
      box-sizing: border-box;
      min-height: 300px;
      display: flex;
      flex-direction: column;
    }

    /* Special styling for RL stats chart */
    #charts-container > div[data-chart-wrapper="1"]:has(#rl-stats-chart) {
      background: linear-gradient(135deg, #f8f9ff 0%, #ffffff 100%);
      border: 2px solid rgba(108,117,255,0.1);
    }

    /* Chart titles */
    .chart-title {
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 0.5rem;
      color: #495057;
    }

    /* reward value label index.js appends inside the reward wrapper */
    #reward-value {
      font-weight: 700;
      font-size: .9rem;
      text-align: center;
      margin-top: 6px;
      color: #212529;
    }

    /* RL stats value label */
    #rl-stats-value {
      font-weight: 600;
      font-size: .85rem;
      text-align: center;
      margin-top: 6px;
      color: var(--accent-rl);
      background: rgba(108,117,255,0.1);
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* Learning indicators */
    .learning-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--accent-rl);
      margin-top: 0.25rem;
    }
    .learning-indicator::before {
      content: "🧠";
      font-size: 1rem;
    }

    /* Performance badges */
    .perf-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(108,117,255,0.1);
      color: var(--accent-rl);
      margin: 0 2px;
    }

    /* ── Footer ──────────────────────────────────────────── */
    .app-footer {
      font-size: .76rem;
      color: #adb5bd;
      text-align: center;
    }

    /* ── Responsive adjustments ──────────────────────────── */
    @media (max-width: 768px) {
      #charts-container {
        grid-template-columns: 1fr;
      }
      
      .app-header h1 {
        font-size: 1.1rem;
      }
      
      .btn-round {
        font-size: 0.85rem;
        padding: 0.35rem 0.8rem;
      }
    }
  </style>
</head>

<body>
<div class="container-lg py-3 d-flex flex-column gap-3">

  <!-- ══ HEADER ════════════════════════════════════════════ -->
  <header class="app-header">
    <span id="sim-status-dot" title="Simulation running"></span>
    <h1>
      CityGenerator
      <span class="badge bg-secondary ms-1"
            style="font-size:.7rem;vertical-align:middle;">AI Learning</span>
    </h1>
  </header>

  <!-- ══ MAP ═══════════════════════════════════════════════ -->
  <div class="sim-card p-0 overflow-hidden">
    <canvas id="map-canvas" width="900" height="360"></canvas>
  </div>

  <!-- ══ CONTROLS ══════════════════════════════════════════ -->
  <div class="sim-card px-3 py-2">
    <p class="section-label mb-2">Simulation Controls</p>
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <button id="pause-btn"             type="button"
              class="btn btn-warning  btn-round">⏸ Pause</button>
      <button id="resume-btn"            type="button"
              class="btn btn-success  btn-round">▶ Resume</button>
      <button id="random-city-model-btn" type="button"
              class="btn btn-primary  btn-round">🔀 Random City Model</button>
      <button id="reset-btn"             type="button"
              class="btn btn-outline-secondary btn-round ms-auto">↺ Reset State</button>
    </div>
  </div>

  <!-- index.js owns innerHTML of this div via renderManagerInfo() -->
  <!-- It also appends dropdown selectors here via setupUI()      -->
  <div id="manager-info" role="status" aria-live="polite"></div>

  <!-- index.js → ensureChartElements() appends chart wrappers here -->
  <div id="charts-container"></div>

  <!-- ══ FOOTER ════════════════════════════════════════════ -->
  <footer class="app-footer pb-2">
    CityGenerator · AI Learning Simulator ·
    <a href="https://github.com/universalbit-dev/CityGenerator"
       target="_blank" rel="noopener"
       class="text-decoration-none">GitHub</a>
  </footer>

</div><!-- /container -->

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- ══ Enhanced Simulation UI helper with RL support ════════════════════ -->
<script>
(function () {
  'use strict';

  /* ── Model tips for all 8 city managers ─────────────────────────────── */
  const MODEL_TIPS = {
    'Circular City':             '♻️ Boost local production, recycling & renewable energy to close the resource loop!',
    'CircularCityManager':       '♻️ Boost local production, recycling & renewable energy to close the resource loop!',
    'Urban Fabric':              '🏗️ Invest in roads, power grid & green space to grow the city fabric.',
    'UrbanFabricManager':        '🏗️ Invest in roads, power grid & green space to grow the city fabric.',
    'Civic Ecosystem':           '🏛️ Engage citizens, open data & grow business density for a thriving ecosystem.',
    'CivicEcosystemManager':     '🏛️ Engage citizens, open data & grow business density for a thriving ecosystem.',
    'Smart City':                '🤖 Deploy sensors, AI services & connectivity for a smarter city.',
    'SmartCityStateManager':     '🤖 Deploy sensors, AI services & connectivity for a smarter city.',
    'Smart City State':          '🤖 Deploy sensors, AI services & connectivity for a smarter city.',
    'Resilient City Model':      '🦾 Build redundancy, diversity & crisis readiness for a resilient city.',
    'ResilientCityModelManager': '🦾 Build redundancy, diversity & crisis readiness for a resilient city.',
    'Resilient City':            '🦾 Build redundancy, diversity & crisis readiness for a resilient city.',
    'Community Commons':         '🤝 Share resources, open public spaces & raise community happiness.',
    'CommunityCommonsManager':   '🤝 Share resources, open public spaces & raise community happiness.',
    'Permaculture Design':       '🌱 Apply permaculture principles for a regenerative urban future.',
    'PermacultureDesignManager': '🌱 Apply permaculture principles for a regenerative urban future.',
    'Cookieless City Agent':     '🔒 Privacy-first agent — your choices boost digital safety.',
    'CookielessCityAgent':       '🔒 Privacy-first agent — your choices boost digital safety.',
    'Cookieless City':           '🔒 Privacy-first agent — your choices boost digital safety.',
  };

  /* ── RL Agent tips ───────────────────────────────────────────────────── */
  const RL_AGENT_TIPS = {
    'random': '🎲 Random actions - baseline performance for comparison',
    'td_learning': '🧠 Q-Learning agent - learns optimal policies through temporal difference',
    'dqn': '🤖 Deep Q-Network - neural network for complex state-action mapping',
    'hybrid': '⚡ Hybrid agent - adaptive exploration with multiple learning strategies'
  };

  /* ── state ───────────────────────────────────────────────────────────── */
  let lastKnownModel = null;
  let lastKnownRLAgent = null;
  let pollTimer = null;

  const $id = id => document.getElementById(id);

  /* ── status dot with RL awareness ────────────────────────────────────── */
  function setSimRunning(running, isLearning = false) {
    const dot = $id('sim-status-dot');
    if (!dot) return;
    
    dot.classList.toggle('paused', !running);
    dot.classList.toggle('learning', running && isLearning);
    
    if (!running) {
      dot.title = 'Simulation paused';
    } else if (isLearning) {
      dot.title = 'AI Learning in progress';
    } else {
      dot.title = 'Simulation running';
    }
  }

  /* ── Enhanced model display with RL support ─────────────────────────── */
  function updateModelDisplay(name, tip, rlAgent = null, rlTip = null) {
    const m = $id('manager-info');
    if (m && m.querySelector('span[style*="color"]')) return;

    const normalized = (typeof name === 'string' && name.trim()) ? name.trim() : null;
    if (!normalized) return;

    if (m) {
      while (m.firstChild) m.removeChild(m.firstChild);

      /* Header div: "Active Model: <span.model-name>" */
      const headerDiv = document.createElement('div');
      headerDiv.style.fontWeight   = '700';
      headerDiv.style.fontSize     = '1rem';
      headerDiv.style.marginBottom = '4px';
      headerDiv.appendChild(document.createTextNode('Active Model: '));
      const nameSpan = document.createElement('span');
      nameSpan.className   = 'model-name';
      nameSpan.textContent = normalized;
      headerDiv.appendChild(nameSpan);

      /* RL Agent info if available */
      if (rlAgent) {
        const rlDiv = document.createElement('div');
        rlDiv.style.fontWeight = '600';
        rlDiv.style.fontSize = '0.9rem';
        rlDiv.style.marginBottom = '4px';
        rlDiv.style.color = '#6c75ff';
        rlDiv.appendChild(document.createTextNode('RL Agent: '));
        const rlSpan = document.createElement('span');
        rlSpan.textContent = rlAgent;
        rlDiv.appendChild(rlSpan);
        headerDiv.appendChild(document.createElement('br'));
        headerDiv.appendChild(rlDiv);
      }

      /* Model tip paragraph */
      const tipP = document.createElement('p');
      tipP.className   = 'model-tip';
      tipP.textContent = tip || MODEL_TIPS[normalized] || 'No tip available for this model.';

      /* RL tip if available */
      if (rlTip) {
        const rlTipP = document.createElement('p');
        rlTipP.style.color = '#666';
        rlTipP.style.fontSize = '0.85rem';
        rlTipP.style.marginTop = '4px';
        rlTipP.style.marginBottom = '0';
        rlTipP.textContent = rlTip;
        
        m.appendChild(headerDiv);
        m.appendChild(tipP);
        m.appendChild(rlTipP);
      } else {
        m.appendChild(headerDiv);
        m.appendChild(tipP);
      }
    }

    lastKnownModel = normalized;
    if (rlAgent) lastKnownRLAgent = rlAgent;
  }

  /* ── Enhanced chart monitoring ───────────────────────────────────────── */
  function monitorChartHealth() {
    // Check if all expected charts are present and rendering
    const expectedCharts = ['state-chart', 'rewardTrendChart', 'rl-stats-chart'];
    const missingCharts = expectedCharts.filter(id => !$id(id));
    
    if (missingCharts.length > 0) {
      console.warn('Missing charts:', missingCharts);
    }

    // Check for RL learning status
    const isLearning = window.rlMode && window.rlMode !== 'random';
    setSimRunning(!window.isPaused, isLearning);
  }

  window.setSimulationModelDisplay = updateModelDisplay;

  /* ── Enhanced model inference with RL support ────────────────────────── */
  function safeGet(obj, path) {
    try { return path.reduce((a,k) => (a && a[k] !== undefined ? a[k] : undefined), obj); }
    catch (_) { return undefined; }
  }

  function gatherModelCandidates() {
    const c = [];
    try {
      if (window.simulationModel)
        c.push(window.simulationModel.name,
               window.simulationModel.modelName,
               window.simulationModel.title);
    } catch (_) {}
    ['currentModelName','modelName','initialModelName'].forEach(k => {
      if (window[k]) c.push(window[k]);
    });
    try {
      if (window.manager)
        c.push(window.manager.modelName,
               safeGet(window,['manager','model','name']),
               safeGet(window,['manager','currentModel','name']),
               safeGet(window,['manager','current','name']),
               safeGet(window,['manager','name']));
    } catch (_) {}
    try {
      if (window.city)
        c.push(window.city.modelName,
               safeGet(window,['city','constructor','name']));
    } catch (_) {}
    try {
      if (window.app)
        c.push(safeGet(window,['app','model','name']),
               safeGet(window,['app','currentModel','name']));
    } catch (_) {}
    try {
      if (document.body?.dataset?.modelName) c.push(document.body.dataset.modelName);
      const el = document.querySelector('[data-model-name]');
      if (el) c.push(el.dataset?.modelName, el.getAttribute?.('data-model-name'));
    } catch (_) {}
    return c.map(v => (typeof v === 'string' ? v.trim() : v)).filter(Boolean);
  }

  function inferModel() {
    const cands = gatherModelCandidates();
    return cands.length ? cands[0] : null;
  }

  function inferRLAgent() {
    try {
      if (window.rlMode) {
        return window.rlMode.split('_').map(word => 
          word.charAt(0).toUpperCase() + word.slice(1)
        ).join(' ');
      }
    } catch (_) {}
    return null;
  }

  /* ── Enhanced polling with RL monitoring ─────────────────────────────── */
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(() => {
      const m = inferModel();
      const rl = inferRLAgent();
      
      if (m && (m !== lastKnownModel || rl !== lastKnownRLAgent)) {
        const rlTip = rl ? RL_AGENT_TIPS[window.rlMode] : null;
        updateModelDisplay(m, MODEL_TIPS[m], rl, rlTip);
      }
      
      monitorChartHealth();
    }, 500);
  }

  /* ── simulationModelChanged event with RL support ───────────────────── */
  window.addEventListener('simulationModelChanged', function (e) {
    const d = e?.detail ?? null;
    const rl = inferRLAgent();
    const rlTip = rl ? RL_AGENT_TIPS[window.rlMode] : null;
    
    if (d?.name) {
      updateModelDisplay(d.name, d.tip, rl, rlTip);
    } else { 
      const m = inferModel(); 
      if (m) updateModelDisplay(m, MODEL_TIPS[m], rl, rlTip);
    }
  });

  /* ── MutationObserver (enhanced for RL) ──────────────────────────────── */
  const mo = new MutationObserver(() => {
    const inferred = inferModel();
    const rl = inferRLAgent();
    if (inferred && (inferred !== lastKnownModel || rl !== lastKnownRLAgent)) {
      const rlTip = rl ? RL_AGENT_TIPS[window.rlMode] : null;
      updateModelDisplay(inferred, MODEL_TIPS[inferred], rl, rlTip);
    }
  });

  /* ── DOMContentLoaded with enhanced controls ─────────────────────────── */
  document.addEventListener('DOMContentLoaded', function () {
    const pauseBtn  = $id('pause-btn');
    const resumeBtn = $id('resume-btn');
    const resetBtn  = $id('reset-btn');

    if (pauseBtn)  pauseBtn.addEventListener ('click', () => setSimRunning(false));
    if (resumeBtn) resumeBtn.addEventListener('click', () => {
      const isLearning = window.rlMode && window.rlMode !== 'random';
      setSimRunning(true, isLearning);
    });
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        try { if (window.manager?.reset) window.manager.reset(); } catch (_) {}
        try { if (window.city?.reset)    window.city.reset();    } catch (_) {}
        try { if (window.currentRLAgent?.reset) window.currentRLAgent.reset(); } catch (_) {}
      });
    }

    const m = inferModel();
    const rl = inferRLAgent();
    if (m) {
      const rlTip = rl ? RL_AGENT_TIPS[window.rlMode] : null;
      updateModelDisplay(m, MODEL_TIPS[m], rl, rlTip);
    }
    
    startPolling();

    try {
      mo.observe(document.body, { attributes: true, childList: true, subtree: false });
    } catch (e) { console.warn('Model observer failed to start', e); }
  });

  /* ── Enhanced debug functions ────────────────────────────────────────── */
  window.getSimulationModelDisplay = () => ({
    name: $id('manager-info')?.querySelector('.model-name')?.textContent ?? null,
    tip:  $id('manager-info')?.querySelector('.model-tip')?.textContent  ?? null,
    rlAgent: lastKnownRLAgent,
    rlMode: window.rlMode ?? null,
    learningStats: window.learningStats ?? null
  });

})();
</script>

</body>
</html>
