name: Security Blocklist Scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  phishdestroy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Download Destroylist
        run: curl -O https://phishdestroy.github.io/destroylist/destroylist.txt

      - name: Download Published Site Content
        run: curl -sSL https://universalbit-dev.github.io/CityGenerator/ > deployed_site.html

      - name: Scan deployed site for phishing blocklist entries
        run: |
          grep -Ff destroylist.txt deployed_site.html > destroylist_matches.txt || true
          if [ -s destroylist_matches.txt ]; then
            echo "Phishing domains found in deployed site! Showing matches:"
            cat destroylist_matches.txt
            exit 1
          else
            echo "No phishing domains found in deployed site."
          fi
