name: Publish CDN Assets

on:
  push:
    tags:
      - 'v*.*.*' # Triggers only when a version tag is pushed
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: write # Required to push the new branch and tags

jobs:
  build-and-push-cdn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site (Webpack)
        run: |
          if [ -f webpack.config.js ]; then
            npx webpack --config webpack.config.js
          else
            npm run build
          fi

      - name: Push compiled assets to 'cdn' branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: cdn
          publish_dir: ./dist
          keep_files: false
          
      - name: Tag the CDN branch
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin cdn
          git checkout cdn
          git tag ${{ github.ref_name }}-cdn
          git push origin ${{ github.ref_name }}-cdn
