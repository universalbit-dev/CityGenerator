name: Snyk Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  snyk-scan:
    runs-on: ubuntu-latest
    environment: snyk  
    
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec1b3cb91fa0249f1161273924614d # v4.0.2
        with:
          node-version: '22'
      
      - name: Verify Snyk token exists
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "❌ ERROR: SNYK_TOKEN secret is not set"
            exit 1
          else
            echo "✅ SNYK_TOKEN secret is configured"
          fi
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@a1a0846059d0473a2139b4f62bfd0ec5ac6317bc # Snyk Node action
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=medium
      
      - name: Run Snyk Monitor (track project)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: snyk/actions/node@a1a0846059d0473a2139b4f62bfd0ec5ac6317bc
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --all-projects
